plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.audiostreamer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.audiostreamer"
        minSdk 24
        targetSdk 34
        // تم تحديث الأرقام دي للنسخة الجديدة
        versionCode 2
        versionName "1.0.1"
    }

    // === إعدادات التوقيع (عشان يشتغل على Realme وكل الأجهزة) ===
    signingConfigs {
        release {
            storeFile file("../my-release-key.jks")
            storePassword "123456" // الباسورد اللي اخترته
            keyAlias "my-key-alias"
            keyPassword "123456"   // الباسورد اللي اخترته
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release // ربط التوقيع
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
